services:
  - type: web
    name: humiao-demo
    runtime: python
    plan: free
    buildCommand: "python -m py_compile common.py hub.py relay.py webconsole.py gateway.py demo_online.py"
    startCommand: "python demo_online.py"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: WEB_TOKEN
        value: parent123
